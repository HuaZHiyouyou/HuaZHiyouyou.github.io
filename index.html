<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桦知柚的个人主页</title>
  <!-- 引入外部资源 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <!-- 引入我们自己的CSS文件 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 左侧边栏 -->
  <aside id="sidebar" class="fixed left-0 top-0 h-full w-64 bg-gray-900 text-white transform -translate-x-full transition-transform duration-300 z-50">
    <div class="p-4">
      <h2 class="text-xl font-bold mb-4">桦知柚的主页</h2>
      <nav>
        <ul class="space-y-2">
          <li><a href="#home" class="block p-2 rounded hover:bg-gray-700"><i class="fa fa-home mr-2"></i>首页</a></li>
          <li><a href="#features" class="block p-2 rounded hover:bg-gray-700"><i class="fa fa-cogs mr-2"></i>功能</a></li>
          <li><a href="#news" class="block p-2 rounded hover:bg-gray-700"><i class="fa fa-newspaper-o mr-2"></i>新闻</a></li>
          <li><a href="#updates" class="block p-2 rounded hover:bg-gray-700"><i class="fa fa-refresh mr-2"></i>更新</a></li>
          <li><a href="#logs" class="block p-2 rounded hover:bg-gray-700"><i class="fa fa-file-text-o mr-2"></i>日志</a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- 顶部栏 -->
  <header class="fixed top-0 left-0 right-0 h-16 bg-white bg-opacity-90 backdrop-blur-md z-40 flex items-center justify-between px-4">
    <button id="sidebar-toggle" class="text-2xl">
      <i class="fa fa-bars"></i>
    </button>
    <h1 class="text-xl font-bold">桦知柚的主页</h1>
    <div class="flex items-center space-x-4">
      <!-- 右上角音乐播放器 -->
      <div id="music-player-mini" class="relative">
        <button id="music-toggle" class="text-2xl">
          <i class="fa fa-music"></i>
        </button>
        <div id="music-panel" class="absolute right-0 top-full mt-2 w-80 bg-white rounded-lg shadow-xl p-4 hidden">
          <h3 class="font-bold mb-2">音乐播放器</h3>
          <audio id="audio-element" class="w-full mb-2" controls>
          <div class="mb-2">
            <label class="block text-sm mb-1">上传本地音乐</label>
            <input type="file" id="music-upload" accept="audio/*" class="w-full text-sm">
          </div>
          <div id="music-list" class="max-h-40 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主内容区 -->
  <main class="pt-16 min-h-screen">
    <!-- 首页 -->
    <section id="home" class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <h1 id="welcome-title" class="text-5xl md:text-7xl font-bold mb-6">欢迎来到桦知柚的主页</h1>
        <p id="welcome-desc" class="text-xl md:text-2xl max-w-2xl mx-auto mb-10">这里是我的个人空间，记录技术成长，分享生活日常，探索更多有趣的可能</p>
        <div class="flex gap-4 justify-center">
          <a href="#features" class="px-8 py-3 rounded-lg font-medium btn-accent">查看功能</a>
          <a href="#news" class="px-8 py-3 rounded-lg font-medium btn-outline">浏览新闻</a>
        </div>
      </div>
    </section>

    <!-- 功能区 -->
    <section id="features" class="py-20">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">内置小工具</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- 今日运势卡片 -->
          <div class="p-6 rounded-2xl shadow-lg transition-all hover:scale-105 card-bg">
            <div class="flex items-center gap-3 mb-4">
              <i class="fa fa-star-o text-2xl icon-accent"></i>
              <h3 class="text-xl font-bold card-title">今日运势</h3>
            </div>
            <div id="fortune-content" class="mb-4 min-h-[100px] flex items-center justify-center text-center">
              <p>点击按钮查看今日运势</p>
            </div>
            <button id="fortune-btn" class="w-full py-2 rounded-lg font-medium transition-all btn-accent">
              抽取今日运势
            </button>
          </div>

          <!-- 吃什么决策卡片 -->
          <div class="p-6 rounded-2xl shadow-lg transition-all hover:scale-105 card-bg">
            <div class="flex items-center gap-3 mb-4">
              <i class="fa fa-cutlery text-2xl icon-accent"></i>
              <h3 class="text-xl font-bold card-title">今天吃什么</h3>
            </div>
            <div id="food-result" class="mb-4 min-h-[100px] flex items-center justify-center text-center text-2xl font-bold card-title">
              <p>?</p>
            </div>
            <button id="food-btn" class="w-full py-2 rounded-lg font-medium transition-all btn-accent">
              帮我决定
            </button>
          </div>

          <!-- 喝什么决策卡片 -->
          <div class="p-6 rounded-2xl shadow-lg transition-all hover:scale-105 card-bg">
            <div class="flex items-center gap-3 mb-4">
              <i class="fa fa-glass text-2xl icon-accent"></i>
              <h3 class="text-xl font-bold card-title">今天喝什么</h3>
            </div>
            <div id="drink-result" class="mb-4 min-h-[100px] flex items-center justify-center text-center text-2xl font-bold card-title">
              <p>?</p>
            </div>
            <button id="drink-btn" class="w-full py-2 rounded-lg font-medium transition-all btn-accent">
              帮我决定
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 新闻区 -->
    <section id="news" class="py-20 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">新闻资讯</h2>
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 新闻内容会通过JS动态加载 -->
        </div>
      </div>
    </section>

    <!-- 更新区 -->
    <section id="updates" class="py-20">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">更新日志</h2>
        <div id="updates-container" class="space-y-4">
          <!-- 更新内容会通过JS动态加载 -->
        </div>
      </div>
    </section>

    <!-- 日志区 -->
    <section id="logs" class="py-20 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">系统日志</h2>
        <div class="flex gap-4 mb-4">
          <button id="clear-logs" class="px-4 py-2 rounded-lg btn-outline">清除日志</button>
          <button id="export-logs" class="px-4 py-2 rounded-lg btn-accent">导出日志</button>
        </div>
        <div id="logs-container" class="bg-white rounded-lg shadow p-4 max-h-96 overflow-y-auto font-mono text-sm">
          <!-- 日志内容会通过JS动态加载 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 粒子画布 -->
  <canvas id="particle-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

  <!-- 暗角遮罩 -->
  <div class="vignette fixed top-0 left-0 w-full h-full pointer-events-none z-1"></div>

  <!-- 背景容器 -->
  <div id="bg-container" class="fixed top-0 left-0 w-full h-full -z-10">
    <div id="bg-default"></div>
  </div>

  <!-- 设置面板 -->
  <div id="settings-panel" class="fixed top-0 right-0 w-full md:w-96 h-full bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-50 overflow-y-auto">
    <div class="p-6">
      <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold section-title">页面设置</h2>
        <button id="settings-close" class="text-2xl section-title">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <!-- 主题颜色设置 -->
      <div class="mb-8">
        <h3 class="text-lg font-bold mb-4 section-title">主题颜色</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-1 text-content">主题模式</label>
            <div class="flex gap-2">
              <button id="theme-light" class="flex-1 py-2 rounded border btn-outline">浅色</button>
              <button id="theme-dark" class="flex-1 py-2 rounded border btn-outline">深色</button>
            </div>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">主背景色</label>
            <input type="color" id="bg-primary-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">次要背景色（卡片）</label>
            <input type="color" id="bg-secondary-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">欢迎标题颜色</label>
            <input type="color" id="text-welcome-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">大标题颜色</label>
            <input type="color" id="text-title-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">正文内容颜色</label>
            <input type="color" id="text-content-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">强调色（按钮/图标）</label>
            <input type="color" id="accent-color-input" class="w-full h-10 rounded cursor-pointer" />
          </div>
        </div>
      </div>

      <!-- 背景设置 -->
      <div class="mb-8">
        <h3 class="text-lg font-bold mb-4 section-title">背景设置</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-1 text-content">背景类型</label>
            <select id="bg-type" class="w-full p-2 rounded border input-border">
              <option value="color">纯色背景</option>
              <option value="image">图片背景</option>
              <option value="video">视频背景</option>
            </select>
          </div>
          <div id="bg-upload-container">
            <label class="block text-sm mb-1 text-content">上传背景文件</label>
            <input type="file" id="bg-upload" class="w-full text-sm" />
            <p class="text-xs opacity-70 mt-1">图片支持jpg/png/gif，视频支持mp4/webm</p>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">背景透明度</label>
            <input type="range" id="bg-opacity-input" min="0" max="1" step="0.01" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">背景模糊度</label>
            <input type="range" id="bg-blur-input" min="0" max="20" step="1" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">暗角强度</label>
            <input type="range" id="vignette-input" min="0" max="1" step="0.01" class="w-full" />
          </div>
        </div>
      </div>

      <!-- 粒子效果设置 -->
      <div class="mb-8">
        <h3 class="text-lg font-bold mb-4 section-title">粒子效果设置</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-1 text-content">粒子开关</label>
            <button id="particle-toggle" class="w-full py-2 rounded border btn-outline">开启粒子效果</button>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子类型</label>
            <div class="flex flex-wrap gap-2">
              <button class="particle-type-btn px-3 py-1 rounded text-sm border btn-outline" data-type="snow">雪花</button>
              <button class="particle-type-btn px-3 py-1 rounded text-sm border btn-outline" data-type="fire">火焰</button>
              <button class="particle-type-btn px-3 py-1 rounded text-sm border btn-outline" data-type="star">星型</button>
              <button class="particle-type-btn px-3 py-1 rounded text-sm border btn-outline" data-type="circle">圆形</button>
            </div>
            <p class="text-xs opacity-70 mt-1">可多选，混合不同粒子效果</p>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子数量</label>
            <input type="range" id="particle-count" min="10" max="500" step="10" value="100" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子大小</label>
            <input type="range" id="particle-size" min="1" max="20" step="0.5" value="3" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子不透明度</label>
            <input type="range" id="particle-opacity" min="0.1" max="1" step="0.1" value="0.8" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子下落速度</label>
            <input type="range" id="particle-speed" min="0.1" max="10" step="0.1" value="2" class="w-full" />
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子显示区域</label>
            <select id="particle-area" class="w-full p-2 rounded border input-border">
              <option value="full">全屏显示</option>
              <option value="hero">仅欢迎区显示</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">粒子层级</label>
            <select id="particle-zindex" class="w-full p-2 rounded border input-border">
              <option value="0">内容下方</option>
              <option value="10">内容上方</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 动画设置 -->
      <div class="mb-8">
        <h3 class="text-lg font-bold mb-4 section-title">交互动画设置</h3>
        <div class="space-y-4">
          <div>
            <label class="block text-sm mb-1 text-content">缓动函数</label>
            <select id="easing-function" class="w-full p-2 rounded border input-border">
              <option value="ease">ease（默认）</option>
              <option value="ease-in">ease-in（加速）</option>
              <option value="ease-out">ease-out（减速）</option>
              <option value="ease-in-out">ease-in-out（先加速后减速）</option>
              <option value="linear">linear（线性）</option>
              <option value="cubic-bezier(0.68, -0.55, 0.265, 1.55)">弹性效果</option>
            </select>
          </div>
          <div>
            <label class="block text-sm mb-1 text-content">动画时长（毫秒）</label>
            <input type="number" id="animation-duration" min="100" max="2000" step="100" value="300" class="w-full p-2 rounded border input-border" />
          </div>
        </div>
      </div>

      <!-- 缓存设置 -->
      <div class="mb-8">
        <h3 class="text-lg font-bold mb-4 section-title">缓存设置</h3>
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <span class="text-sm text-content">启用本地缓存</span>
            <input type="checkbox" id="cache-enabled" checked class="w-5 h-5" />
          </div>
          <div class="flex items-center justify-between">
            <span class="text-sm text-content">保存浏览痕迹</span>
            <input type="checkbox" id="history-enabled" checked class="w-5 h-5" />
          </div>
          <button id="clear-cache" class="w-full py-2 rounded border btn-outline">清除所有缓存</button>
        </div>
      </div>

      <!-- 重置设置 -->
      <div class="mb-8">
        <button id="settings-reset" class="w-full py-2 rounded-lg border border-red-500 text-red-500 hover:bg-red-500 hover:text-white transition-all">
          重置所有设置
        </button>
      </div>
    </div>
  </div>

  <!-- 设置按钮 -->
  <button id="settings-toggle" class="fixed bottom-6 right-6 w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl z-40 transition-all hover:scale-110 btn-accent">
    <i class="fa fa-cog"></i>
  </button>

  <!-- 引入我们自己的JS文件 -->
  <script src="js/cache.js"></script>
  <script src="js/logger.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
