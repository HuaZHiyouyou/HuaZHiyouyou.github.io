<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 - HuaZHiyouyou</title>
  <!-- 核心样式 - 加版本号防缓存 -->
  <link rel="stylesheet" href="css/style.css?v=2.1" />
  <!-- 图标库 -->
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Tailwind CSS -->
  <link href="https://cdn.bootcdn.net/ajax/libs/tailwindcss/3.3.2/tailwind.min.css" rel="stylesheet">

  <!-- 自定义CSS变量 -->
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --text-welcome: #2563eb;
      --text-title: #1a1a1a;
      --text-content: #4a4a4a;
      --accent-color: #2563eb;
      --bg-opacity: 1;
      --bg-blur: 0px;
      --vignette-opacity: 0;
      --particle-z-index: 0;
      --animation-duration: 300ms;
      --easing-function: ease;
    }

    /* 基础样式 */
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-content);
      overflow-x: hidden;
    }

    /* 背景容器 */
    #bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
    }

    #bg-default {
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
      opacity: var(--bg-opacity);
      filter: blur(var(--bg-blur));
    }

    .bg-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: var(--bg-opacity);
      filter: blur(var(--bg-blur));
    }

    /* 粒子画布 */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: var(--particle-z-index);
      pointer-events: none;
    }

    /* 卡片样式 */
    .card-bg {
      background-color: rgba(var(--bg-primary-rgb), 0.8);
      backdrop-filter: blur(8px);
    }

    .card-title {
      color: var(--text-title);
    }

    .card-content {
      color: var(--text-content);
    }

    /* 按钮样式 */
    .btn-accent {
      background-color: var(--accent-color);
      color: white;
      transition: all var(--animation-duration) var(--easing-function);
    }

    .btn-accent:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      transition: all var(--animation-duration) var(--easing-function);
    }

    .btn-outline:hover {
      background-color: var(--accent-color);
      color: white;
    }

    /* 侧边栏 */
    #sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100vh;
      background-color: var(--bg-secondary);
      z-index: 999;
      transition: left var(--animation-duration) var(--easing-function);
      padding: 2rem;
      overflow-y: auto;
    }

    #sidebar.open {
      left: 0;
    }

    /* 音乐面板 */
    #music-panel {
      position: fixed;
      top: 80px;
      right: -350px;
      width: 350px;
      background-color: var(--bg-secondary);
      z-index: 998;
      transition: right var(--animation-duration) var(--easing-function);
      border-radius: 8px 0 0 8px;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
      padding: 1rem;
    }

    #music-panel.show {
      right: 0;
    }

    /* 设置面板 */
    #settings-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 400px;
      height: 100vh;
      background-color: var(--bg-secondary);
      z-index: 999;
      transition: right var(--animation-duration) var(--easing-function);
      padding: 2rem;
      overflow-y: auto;
    }

    #settings-panel.open {
      right: 0;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      #settings-panel {
        width: 100%;
        right: -100%;
      }
      #music-panel {
        width: 100%;
        right: -100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <!-- 粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 背景容器 -->
  <div id="bg-container">
    <div id="bg-default"></div>
  </div>

  <!-- 头部导航 -->
  <header class="fixed top-0 left-0 w-full bg-white/90 backdrop-blur-sm z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <!-- 侧边栏切换 -->
      <button id="sidebar-toggle" class="text-xl text-accent-color p-2">
        <i class="fa fa-bars"></i>
      </button>

      <!-- 标题 -->
      <h1 class="text-xl font-bold text-title">HuaZHiyouyou 的个人主页</h1>

      <!-- 音乐播放器切换 -->
      <button id="music-toggle" class="text-xl text-accent-color p-2">
        <i class="fa fa-music"></i>
      </button>
    </div>
  </header>

  <!-- 侧边栏 -->
  <div id="sidebar" class="shadow-lg">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-title">导航菜单</h2>
      <button class="text-accent-color" onclick="document.getElementById('sidebar').classList.remove('open')">
        <i class="fa fa-times"></i>
      </button>
    </div>
    <nav class="space-y-4">
      <a href="#home" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-home mr-2"></i> 首页
      </a>
      <a href="#repos" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-github mr-2"></i> GitHub仓库
      </a>
      <a href="#news" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-newspaper mr-2"></i> 最新动态
      </a>
      <a href="#updates" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-history mr-2"></i> 更新日志
      </a>
      <a href="#tools" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-tools mr-2"></i> 实用工具
      </a>
      <a href="#logs" class="block py-2 px-4 rounded hover:bg-primary/50 transition-colors">
        <i class="fa fa-file-lines mr-2"></i> 系统日志
      </a>
    </nav>
  </div>

  <!-- 音乐面板 -->
  <div id="music-panel" class="bg-secondary">
    <div class="flex justify-between items-center mb-2">
      <h3 class="font-bold text-title">音乐播放器</h3>
      <button class="text-accent-color" onclick="document.getElementById('music-panel').classList.remove('show')">
        <i class="fa fa-times"></i>
      </button>
    </div>
    <input type="file" id="music-upload" accept="audio/*" class="mb-2 w-full">
    <div id="music-list" class="max-h-64 overflow-y-auto">
      <p class="text-xs opacity-70">上传的音乐将显示在这里</p>
    </div>
    <audio id="audio-element" class="w-full mt-2" controls></audio>
  </div>

  <!-- 设置面板 -->
  <div id="settings-panel" class="bg-secondary shadow-lg">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-title">个性化设置</h2>
      <button id="settings-close" class="text-accent-color">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <!-- 主题设置 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-title">主题设置</h3>
      <div class="flex gap-4 mb-4">
        <button id="theme-light" class="px-4 py-2 rounded-lg btn-outline">浅色主题</button>
        <button id="theme-dark" class="px-4 py-2 rounded-lg btn-outline">深色主题</button>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-sm mb-1">背景主色</label>
          <input type="color" id="bg-primary-input" class="w-full h-10 rounded">
        </div>
        <div>
          <label class="block text-sm mb-1">背景次色</label>
          <input type="color" id="bg-secondary-input" class="w-full h-10 rounded">
        </div>
        <div>
          <label class="block text-sm mb-1">欢迎文字色</label>
          <input type="color" id="text-welcome-input" class="w-full h-10 rounded">
        </div>
        <div>
          <label class="block text-sm mb-1">标题文字色</label>
          <input type="color" id="text-title-input" class="w-full h-10 rounded">
        </div>
        <div>
          <label class="block text-sm mb-1">内容文字色</label>
          <input type="color" id="text-content-input" class="w-full h-10 rounded">
        </div>
        <div>
          <label class="block text-sm mb-1">强调色</label>
          <input type="color" id="accent-color-input" class="w-full h-10 rounded">
        </div>
      </div>
    </div>

    <!-- 背景设置 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-title">背景设置</h3>
      <div class="mb-4">
        <label class="block text-sm mb-2">背景类型</label>
        <select id="bg-type" class="w-full px-4 py-2 rounded-lg border border-gray-300">
          <option value="color">纯色背景</option>
          <option value="image">图片背景</option>
          <option value="video">视频背景</option>
        </select>
      </div>

      <div id="bg-upload-container" class="mb-4 hidden">
        <label class="block text-sm mb-2">上传背景</label>
        <input type="file" id="bg-upload" class="w-full">
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1">背景透明度: <span id="bg-opacity-value">1</span></label>
          <input type="range" id="bg-opacity-input" min="0" max="1" step="0.1" value="1" class="w-full">
        </div>
        <div>
          <label class="block text-sm mb-1">背景模糊度: <span id="bg-blur-value">0</span>px</label>
          <input type="range" id="bg-blur-input" min="0" max="20" step="1" value="0" class="w-full">
        </div>
        <div>
          <label class="block text-sm mb-1">暗角强度: <span id="vignette-value">0</span></label>
          <input type="range" id="vignette-input" min="0" max="1" step="0.1" value="0" class="w-full">
        </div>
      </div>
    </div>

    <!-- 粒子效果设置 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-title">粒子效果</h3>
      <button id="particle-toggle" class="px-4 py-2 rounded-lg btn-outline mb-4">开启粒子效果</button>

      <div class="mb-4">
        <label class="block text-sm mb-2">粒子类型</label>
        <div class="flex flex-wrap gap-2">
          <button class="particle-type-btn px-3 py-1 rounded" data-type="snow">雪花</button>
          <button class="particle-type-btn px-3 py-1 rounded" data-type="fire">火焰</button>
          <button class="particle-type-btn px-3 py-1 rounded" data-type="star">星星</button>
          <button class="particle-type-btn px-3 py-1 rounded" data-type="circle">圆点</button>
        </div>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm mb-1">粒子数量: <span id="particle-count-value">100</span></label>
          <input type="range" id="particle-count" min="0" max="500" step="10" value="100" class="w-full">
        </div>
        <div>
          <label class="block text-sm mb-1">粒子大小: <span id="particle-size-value">3</span></label>
          <input type="range" id="particle-size" min="1" max="10" step="1" value="3" class="w-full">
        </div>
        <div>
          <label class="block text-sm mb-1">粒子透明度: <span id="particle-opacity-value">0.8</span></label>
          <input type="range" id="particle-opacity" min="0.1" max="1" step="0.1" value="0.8" class="w-full">
        </div>
        <div>
          <label class="block text-sm mb-1">粒子速度: <span id="particle-speed-value">2</span></label>
          <input type="range" id="particle-speed" min="0.5" max="5" step="0.5" value="2" class="w-full">
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm mb-2">粒子显示区域</label>
        <select id="particle-area" class="w-full px-4 py-2 rounded-lg border border-gray-300">
          <option value="full">全屏显示</option>
          <option value="hero">仅首页区域</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-2">粒子层级</label>
        <select id="particle-zindex" class="w-full px-4 py-2 rounded-lg border border-gray-300">
          <option value="-1">背景下层</option>
          <option value="0">背景上层</option>
          <option value="1">内容下层</option>
          <option value="99">内容上层</option>
        </select>
      </div>
    </div>

    <!-- 动画设置 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-title">动画设置</h3>
      <div>
        <label class="block text-sm mb-1">动画时长: <span id="animation-duration-value">300</span>ms</label>
        <input type="range" id="animation-duration" min="100" max="1000" step="50" value="300" class="w-full">
      </div>
      <div class="mt-4">
        <label class="block text-sm mb-2">缓动函数</label>
        <select id="easing-function" class="w-full px-4 py-2 rounded-lg border border-gray-300">
          <option value="ease">默认</option>
          <option value="ease-in">淡入</option>
          <option value="ease-out">淡出</option>
          <option value="ease-in-out">淡入淡出</option>
          <option value="linear">线性</option>
        </select>
      </div>
    </div>

    <!-- 缓存设置 -->
    <div class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-title">缓存设置</h3>
      <div class="space-y-2">
        <label class="flex items-center gap-2">
          <input type="checkbox" id="cache-enabled" checked class="w-4 h-4">
          <span>启用本地缓存</span>
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="history-enabled" checked class="w-4 h-4">
          <span>记录浏览痕迹</span>
        </label>
      </div>
      <button id="clear-cache" class="mt-4 px-4 py-2 rounded-lg btn-outline">清除所有缓存</button>
    </div>

    <!-- 重置按钮 -->
    <button id="settings-reset" class="w-full px-4 py-2 rounded-lg btn-outline mt-8">重置所有设置</button>
  </div>

  <!-- 主内容区 -->
  <main class="pt-20 pb-10">
    <!-- 首页区域 -->
    <section id="home" class="py-20">
      <div class="max-w-7xl mx-auto px-4 text-center">
        <h2 class="text-4xl font-bold mb-6 text-welcome">欢迎来到我的个人主页</h2>
        <p class="text-xl mb-10 text-content">这是一个基于HTML/CSS/JS构建的个性化主页</p>
        <button id="settings-toggle" class="px-6 py-3 rounded-lg btn-accent text-lg">
          <i class="fa fa-cog mr-2"></i> 个性化设置
        </button>
      </div>
    </section>

    <!-- GitHub仓库 -->
    <section id="repos" class="py-20 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">GitHub 仓库</h2>
        <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- 仓库内容会通过JS动态加载 -->
        </div>
      </div>
    </section>

    <!-- 最新动态 -->
    <section id="news" class="py-20">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">最新动态</h2>
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- 新闻内容会通过JS动态加载 -->
        </div>
      </div>
    </section>

    <!-- 更新日志 -->
    <section id="updates" class="py-20 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">更新日志</h2>
        <div id="updates-container" class="space-y-6">
          <!-- 更新日志会通过JS动态加载 -->
        </div>
      </div>
    </section>

    <!-- 实用工具 -->
    <section id="tools" class="py-20">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">实用小工具</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <!-- 今日运势 -->
          <div class="p-6 rounded-lg shadow card-bg">
            <h3 class="text-xl font-bold mb-4 card-title">今日运势</h3>
            <button id="fortune-btn" class="px-4 py-2 rounded-lg btn-accent mb-4">抽取运势</button>
            <div id="fortune-content" class="min-h-[60px] text-center card-content"></div>
          </div>

          <!-- 吃什么 -->
          <div class="p-6 rounded-lg shadow card-bg">
            <h3 class="text-xl font-bold mb-4 card-title">今天吃什么</h3>
            <button id="food-btn" class="px-4 py-2 rounded-lg btn-accent mb-4">帮我决定</button>
            <div id="food-result" class="min-h-[60px] text-center text-xl font-bold card-content"></div>
          </div>

          <!-- 喝什么 -->
          <div class="p-6 rounded-lg shadow card-bg">
            <h3 class="text-xl font-bold mb-4 card-title">今天喝什么</h3>
            <button id="drink-btn" class="px-4 py-2 rounded-lg btn-accent mb-4">帮我决定</button>
            <div id="drink-result" class="min-h-[60px] text-center text-xl font-bold card-content"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 系统日志 -->
    <section id="logs" class="py-20 bg-gray-50">
      <div class="max-w-7xl mx-auto px-4">
        <h2 class="text-3xl font-bold mb-10 text-center section-title">系统日志</h2>
        <!-- 按钮居中对齐 - 核心修改点 -->
        <div class="flex gap-4 mb-4 justify-center">
          <button id="clear-logs" class="px-4 py-2 rounded-lg btn-outline">清除日志</button>
          <button id="export-logs" class="px-4 py-2 rounded-lg btn-accent">导出日志</button>
        </div>
        <div id="logs-container" class="bg-white rounded-lg shadow p-4 max-h-96 overflow-y-auto font-mono text-sm">
          <!-- 日志内容会通过JS动态加载 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 底部 -->
  <footer class="py-6 bg-secondary text-center text-content">
    <div class="max-w-7xl mx-auto px-4">
      <p>© 2026 HuaZHiyouyou 的个人主页 | 基于HTML/CSS/JS构建</p>
    </div>
  </footer>

  <!-- 核心JS - 加版本号防缓存，顺序不能乱 -->
  <script src="js/cache.js?v=2.1"></script>
  <script src="js/logger.js?v=2.1"></script>
  <script src="js/particles.js?v=2.1"></script>
  <script src="js/ui.js?v=2.1"></script>
  <script src="js/main.js?v=2.1"></script>
</body>
</html>
