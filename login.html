<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 管理面板</title>
  <link rel="icon" href="assets/picture/6324c68fed0ce0460e347ccb4ce8a620.jpg" type="image/jpeg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/secure-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" title="切换主题">
    <i class="fa fa-moon-o"></i>
  </button>

  <div class="login-container">
    <div class="login-header">
      <img src="assets/avatar/huazhiyou.jpg" alt="头像" class="logo">
      <h1>管理面板</h1>
      <p>请输入账号密码登录</p>
    </div>

    <div class="error-message" id="error-message">
      <i class="fa fa-exclamation-circle"></i> 
      <span id="error-text">账号或密码错误</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        <i class="fa fa-sign-in"></i> 登录
      </button>
    </form>

    <div class="back-home">
      <a href="index.html">
        <i class="fa fa-home"></i> 返回首页
      </a>
    </div>
  </div>
</body>
</html>
