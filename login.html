<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 管理面板</title>
  <link rel="icon" href="assets/picture/6324c68fed0ce0460e347ccb4ce8a620.jpg" type="image/jpeg">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');

    :root {
      --accent: #3B82F6;
      --accent-light: #93C5FD;
      --accent-glow: rgba(59, 130, 246, 0.25);
      --bg: #EFF6FF;
      --bg-card: rgba(255, 255, 255, 0.88);
      --text: #1E293B;
      --text-sub: #64748B;
      --border: rgba(59, 130, 246, 0.12);
      --shadow: rgba(59, 130, 246, 0.08);
    }

    [data-theme="dark"] {
      --accent: #60A5FA;
      --accent-light: #93C5FD;
      --bg: #0F172A;
      --bg-card: rgba(30, 41, 59, 0.88);
      --text: #F1F5F9;
      --text-sub: #CBD5E1;
      --border: rgba(96, 165, 250, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: linear-gradient(135deg, #dbeafe 0%, #93c5fd 50%, #60a5fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .login-container {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .login-header .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      box-shadow: 0 8px 20px var(--accent-glow);
      margin-bottom: 1.5rem;
    }

    .login-header h1 {
      font-size: 1.75rem;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .login-header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text);
      font-weight: 500;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.875rem 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.8);
      color: var(--text);
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group input::placeholder {
      color: var(--text-sub);
      opacity: 0.7;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px var(--accent-glow);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .back-home {
      text-align: center;
      margin-top: 1.5rem;
    }

    .back-home a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .back-home a:hover {
      color: var(--accent);
    }

    .theme-toggle {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      color: var(--text);
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
    <i class="fa fa-moon-o"></i>
  </button>

  <div class="login-container">
    <div class="login-header">
      <img src="assets/avatar/huazhiyou.jpg" alt="头像" class="logo">
      <h1>管理面板</h1>
      <p>请输入账号密码登录</p>
    </div>

    <div class="error-message" id="error-message">
      <i class="fa fa-exclamation-circle"></i> 
      <span id="error-text">账号或密码错误</span>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="login-btn">
        <i class="fa fa-sign-in"></i> 登录
      </button>
    </form>

    <div class="back-home">
      <a href="index.html">
        <i class="fa fa-home"></i> 返回首页
      </a>
    </div>
  </div>

  <script>
    // 默认账号密码
    const DEFAULT_USERNAME = 'admin';
    const DEFAULT_PASSWORD = 'huazhiyouyou';

    // 检查是否已登录
    if (localStorage.getItem('adminLoggedIn') === 'true') {
      window.location.href = 'manage.html';
    }

    // 主题切换
    function toggleTheme() {
      const html = document.documentElement;
      if (html.getAttribute('data-theme') === 'dark') {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
      } else {
        html.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    // 恢复主题
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    // 登录表单提交
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('error-message');
      const loginBtn = document.getElementById('login-btn');
      
      // 验证账号密码
      if (username === DEFAULT_USERNAME && password === DEFAULT_PASSWORD) {
        // 登录成功
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminUsername', username);
        window.location.href = 'manage.html';
      } else {
        // 登录失败
        errorMessage.classList.add('show');
        document.getElementById('error-text').textContent = '账号或密码错误';
        
        // 添加抖动效果
        const container = document.querySelector('.login-container');
        container.style.animation = 'shake 0.5s ease';
        setTimeout(() => {
          container.style.animation = '';
        }, 500);
      }
    });

    // 添加抖动动画
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
