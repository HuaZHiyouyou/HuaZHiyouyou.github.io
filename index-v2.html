<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桦知柚的个人主页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    
    :root {
      --accent: #3B82F6;
      --accent-light: #93C5FD;
      --accent-dark: #1E40AF;
      --bg: #EFF6FF;
      --bg-card: rgba(255, 255, 255, 0.9);
      --text: #1E293B;
      --text-sub: #64748B;
      --text-muted: #94A3B8;
      --border: rgba(59, 130, 246, 0.15);
      --shadow: rgba(59, 130, 246, 0.08);
    }

    [data-theme="dark"] {
      --accent: #60A5FA;
      --accent-light: #93C5FD;
      --accent-dark: #3B82F6;
      --bg: #0F172A;
      --bg-card: rgba(30, 41, 59, 0.9);
      --text: #F1F5F9;
      --text-sub: #CBD5E1;
      --text-muted: #64748B;
      --border: rgba(96, 165, 250, 0.15);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      height: 100%;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      transition: background 0.5s ease, color 0.5s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .fa {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, var(--accent) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, var(--accent-light) 0%, transparent 50%);
      opacity: 0.03;
    }

    .deco-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 20s ease-in-out infinite;
    }

    .deco-blob:nth-child(1) {
      width: 500px;
      height: 500px;
      background: var(--accent);
      top: -150px;
      right: -150px;
    }

    .deco-blob:nth-child(2) {
      width: 400px;
      height: 400px;
      background: var(--accent-light);
      bottom: -100px;
      left: -100px;
      animation-delay: -7s;
    }

    .deco-blob:nth-child(3) {
      width: 250px;
      height: 250px;
      background: var(--accent);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.08;
      animation-delay: -14s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(40px, -30px) scale(1.08); }
      50% { transform: translate(-30px, 40px) scale(0.95); }
      75% { transform: translate(20px, 20px) scale(1.03); }
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      transition: box-shadow 0.3s ease;
    }

    .navbar.scrolled {
      box-shadow: 0 8px 40px var(--shadow);
    }

    .nav-link {
      position: relative;
      color: var(--text-sub);
      text-decoration: none;
      padding: 0.25rem 0;
      transition: color 0.25s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease, left 0.3s ease;
    }

    .nav-link:hover {
      color: var(--accent);
    }

    .nav-link:hover::after {
      width: 100%;
      left: 0;
    }

    main {
      position: relative;
      z-index: 1;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 6rem 1.5rem 4rem;
    }

    .hero-title {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: fadeUp 0.8s ease both;
    }

    .hero-sub {
      font-size: 1.125rem;
      color: var(--text-sub);
      max-width: 500px;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s ease 0.1s both;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeUp 0.8s ease 0.2s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: 14px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .btn-fill {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      box-shadow: 0 4px 15px var(--shadow);
    }

    .btn-fill:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px var(--shadow);
    }

    .btn-fill:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
    }

    .btn-outline:hover {
      background: var(--accent);
      color: white;
    }

    .section {
      padding: 6rem 1.5rem;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .section-sub {
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 3rem;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 20px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      box-shadow: 0 4px 20px var(--shadow);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px var(--shadow);
      border-color: var(--accent);
    }

    .repo-card {
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .repo-card .line-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s ease;
    }

    .repo-card:hover .line-top {
      transform: scaleX(1);
    }

    .repo-card .bg-glow {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      opacity: 0;
      transition: opacity 0.35s ease;
      pointer-events: none;
    }

    .repo-card:hover .bg-glow {
      opacity: 0.03;
    }

    .repo-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 1rem;
      font-size: 1.25rem;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .repo-card:hover .repo-icon {
      transform: scale(1.05) rotate(-3deg);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.35);
    }

    .lang-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(59, 130, 246, 0.08);
      color: var(--accent);
      transition: background 0.25s ease;
    }

    .repo-card:hover .lang-tag {
      background: rgba(59, 130, 246, 0.15);
    }

    .lang-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .log-card {
      position: relative;
      overflow: hidden;
    }

    .log-card .line-left {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, var(--accent), var(--accent-light));
      border-radius: 4px 0 0 4px;
      transition: width 0.3s ease;
    }

    .log-card:hover .line-left {
      width: 5px;
    }

    .log-card .line-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.4s ease;
    }

    .log-card:hover .line-top {
      transform: scaleX(1);
    }

    .version-badge {
      display: inline-flex;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .log-card:hover .version-badge {
      transform: scale(1.03);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .log-item {
      display: flex;
      align-items: flex-start;
      gap: 0.625rem;
      color: var(--text-sub);
      font-size: 0.9rem;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .log-item:hover {
      color: var(--text);
      transform: translateX(3px);
    }

    .log-item i {
      color: var(--accent);
      margin-top: 0.3rem;
      font-size: 0.8rem;
      transition: transform 0.2s ease;
    }

    .log-item:hover i {
      transform: scale(1.15);
    }

    .theme-btn {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px var(--shadow);
      z-index: 100;
      font-size: 1.25rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .theme-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px var(--shadow);
    }

    .theme-btn:active {
      transform: scale(0.95);
    }

    .theme-btn i {
      transition: transform 0.4s ease;
    }

    .theme-btn:hover i {
      transform: rotate(180deg);
    }

    .footer {
      background: var(--bg-card);
      backdrop-filter: blur(20px) saturate(180%);
      border-top: 1px solid var(--border);
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .footer-link {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 1.1rem;
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .footer-link:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.3);
    }

    .footer-link:active {
      transform: translateY(-1px);
    }

    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg);
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--accent), var(--accent-light));
      border-radius: 4px;
      border: 2px solid var(--bg);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-dark);
    }

    ::selection {
      background: var(--accent);
      color: white;
    }

    @media (max-width: 640px) {
      .hero {
        padding: 5rem 1rem 3rem;
      }

      .section {
        padding: 4rem 1rem;
      }

      .theme-btn {
        width: 48px;
        height: 48px;
        bottom: 1rem;
        right: 1rem;
        font-size: 1.1rem;
      }

      .card {
        border-radius: 16px;
        padding: 1.25rem;
      }

      .btn {
        padding: 0.7rem 1.25rem;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="deco-blob"></div>
  <div class="deco-blob"></div>
  <div class="deco-blob"></div>

  <nav class="navbar">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa fa-paw" style="color: var(--accent); font-size: 1.25rem;"></i>
        <span class="font-bold" style="color: var(--accent);">桦知柚</span>
      </div>
      <div class="flex items-center gap-6 text-sm">
        <a href="#home" class="nav-link">首页</a>
        <a href="#repos" class="nav-link">仓库</a>
        <a href="#logs" class="nav-link">日志</a>
      </div>
    </div>
  </nav>

  <main>
    <section id="home" class="hero">
      <h1 class="hero-title">欢迎来到桦知柚的主页</h1>
      <p class="hero-sub">这里是我的个人空间，记录技术成长，分享生活日常，探索更多有趣的可能</p>
      <div class="hero-btns">
        <a href="#repos" class="btn btn-fill">
          <i class="fa fa-github"></i> 查看仓库
        </a>
        <a href="#logs" class="btn btn-outline">
          浏览日志 <i class="fa fa-arrow-right"></i>
        </a>
      </div>
    </section>

    <section id="repos" class="section">
      <div class="max-w-5xl mx-auto">
        <h2 class="section-title reveal">项目仓库</h2>
        <p class="section-sub reveal">我的开源项目与技术实践</p>
        <div id="repos-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </div>
    </section>

    <section id="logs" class="section">
      <div class="max-w-2xl mx-auto">
        <h2 class="section-title reveal">更新日志</h2>
        <p class="section-sub reveal">记录技术思考与成长历程</p>
        <div id="logs-list" class="space-y-5"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/HuaZHiyouyou" target="_blank" class="footer-link">
        <i class="fa fa-github"></i>
      </a>
      <a href="#" class="footer-link">
        <i class="fa fa-twitter"></i>
      </a>
      <a href="#" class="footer-link">
        <i class="fa fa-envelope-o"></i>
      </a>
    </div>
    <p style="color: var(--text-muted); font-size: 0.875rem;">
      &copy; 2024 桦知柚的个人主页
    </p>
  </footer>

  <button id="theme-btn" class="theme-btn" title="切换主题">
    <i id="theme-icon" class="fa fa-moon-o"></i>
  </button>

  <script>
    const themeBtn = document.getElementById('theme-btn');
    const themeIcon = document.getElementById('theme-icon');
    let isDark = localStorage.getItem('theme') === 'dark';

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
      themeIcon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    applyTheme();

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      applyTheme();
    });

    const navbar = document.querySelector('.navbar');
    
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 20);
    }, { passive: true });

    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        const target = document.querySelector(a.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    function initReveal() {
      const observer = new IntersectionObserver(entries => {
        entries.forEach((entry, index) => {
          if (entry.isIntersecting) {
            setTimeout(() => {
              entry.target.classList.add('visible');
            }, index * 60);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -30px 0px' });

      document.querySelectorAll('.reveal:not(.visible)').forEach(el => observer.observe(el));
    }

    const langColors = {
      'JavaScript': '#f1e05a', 'TypeScript': '#3178c6', 'Python': '#3572A5',
      'Java': '#b07219', 'HTML': '#e34c26', 'CSS': '#563d7c', 'Vue': '#41b883',
      'Go': '#00ADD8', 'Rust': '#dea584', 'C++': '#f34b7d', 'C': '#555555',
      'Shell': '#89e051', 'Dockerfile': '#384d54'
    };

    fetch('https://api.github.com/users/HuaZHiyouyou/repos?sort=updated&per_page=6')
      .then(r => r.json())
      .then(repos => {
        const container = document.getElementById('repos-list');
        if (!Array.isArray(repos) || !repos.length) {
          container.innerHTML = '<p class="col-span-full text-center" style="color: var(--text-sub);">暂无公开仓库</p>';
          return;
        }
        container.innerHTML = repos.map(repo => `
          <a href="${repo.html_url}" target="_blank" class="card repo-card reveal">
            <div class="bg-glow"></div>
            <div class="line-top"></div>
            <div class="repo-icon"><i class="fa fa-github"></i></div>
            <h3 style="font-weight: 600; margin-bottom: 0.5rem; color: var(--text); position: relative;">${repo.name}</h3>
            <p style="color: var(--text-sub); font-size: 0.875rem; margin-bottom: 1rem; min-height: 2.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; position: relative;">${repo.description || '暂无描述'}</p>
            ${repo.language ? `<div class="lang-tag" style="margin-bottom: 0.75rem; position: relative;"><span class="lang-dot" style="background: ${langColors[repo.language] || '#60A5FA'}"></span>${repo.language}</div>` : ''}
            <div style="display: flex; gap: 1rem; font-size: 0.875rem; color: var(--text-muted); position: relative;">
              <span><i class="fa fa-star"></i> ${repo.stargazers_count}</span>
              <span><i class="fa fa-code-fork"></i> ${repo.forks_count}</span>
            </div>
          </a>
        `).join('');
        initReveal();
      })
      .catch(() => {
        document.getElementById('repos-list').innerHTML = '<p class="col-span-full text-center" style="color: var(--text-sub);">加载失败</p>';
      });

    const logs = [
      { ver: 'v3.0', date: '2026-03-14', items: ['简化页面功能，移除小工具和相册', '主题色改为蓝色', '新增粒子切换按钮', '设置改为深色模式切换'] },
      { ver: 'v2.0', date: '2026-02-17', items: ['添加了完整的缓存管理系统', '实现了日志记录和查看功能', '优化了粒子系统', '添加了左侧边栏和新闻模块'] },
      { ver: 'v1.0', date: '2026-02-16', items: ['初始版本发布', '基础页面结构', '简单的粒子效果', '音乐播放器'] }
    ];

    document.getElementById('logs-list').innerHTML = logs.map(log => `
      <div class="card log-card reveal" style="padding-left: 2rem;">
        <div class="line-left"></div>
        <div class="line-top"></div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; position: relative;">
          <div class="version-badge">${log.ver}</div>
          <span style="color: var(--text-muted); font-size: 0.875rem;"><i class="fa fa-calendar" style="margin-right: 0.25rem;"></i>${log.date}</span>
        </div>
        <ul style="display: flex; flex-direction: column; gap: 0.625rem; position: relative;">
          ${log.items.map(item => `<li class="log-item"><i class="fa fa-check-circle"></i><span>${item}</span></li>`).join('')}
        </ul>
      </div>
    `).join('');

    initReveal();
  </script>
</body>
</html>
