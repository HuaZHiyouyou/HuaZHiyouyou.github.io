<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桦知柚的个人主页 - 美化版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    
    :root {
      --accent-color: #3B82F6;
      --accent-light: #93C5FD;
      --accent-dark: #1E40AF;
      --bg-primary: #F8FAFC;
      --bg-secondary: rgba(255, 255, 255, 0.85);
      --text-primary: #1E293B;
      --text-secondary: #64748B;
      --text-muted: #94A3B8;
      --border-color: rgba(59, 130, 246, 0.2);
      --shadow-color: rgba(59, 130, 246, 0.1);
      --gradient-start: #EFF6FF;
      --gradient-end: #DBEAFE;
      --transition-fast: 200ms;
      --transition-normal: 300ms;
      --transition-slow: 500ms;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }

    [data-theme="dark"] {
      --accent-color: #60A5FA;
      --accent-light: #93C5FD;
      --accent-dark: #3B82F6;
      --bg-primary: #0F172A;
      --bg-secondary: rgba(15, 23, 42, 0.85);
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;
      --border-color: rgba(96, 165, 250, 0.2);
      --shadow-color: rgba(96, 165, 250, 0.1);
      --gradient-start: #1E293B;
      --gradient-end: #0F172A;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
      color: var(--text-primary);
      min-height: 100vh;
      transition: background var(--transition-normal) ease, color var(--transition-normal) ease;
      overflow-x: hidden;
    }

    /* 背景装饰 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      overflow: hidden;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-color) 0%, transparent 70%);
      opacity: 0.05;
      animation: float 20s infinite ease-in-out;
    }

    .bg-circle:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -200px;
      right: -100px;
      animation-delay: 0s;
    }

    .bg-circle:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -100px;
      left: -50px;
      animation-delay: -5s;
    }

    .bg-circle:nth-child(3) {
      width: 300px;
      height: 300px;
      top: 50%;
      left: 50%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(20px, -20px) rotate(5deg); }
      50% { transform: translate(-10px, 10px) rotate(-5deg); }
      75% { transform: translate(-20px, -10px) rotate(3deg); }
    }

    /* 导航栏 */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      transition: all var(--transition-normal) ease;
    }

    .navbar.scrolled {
      box-shadow: 0 4px 20px var(--shadow-color);
    }

    /* 卡片样式 */
    .card {
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 1.5rem;
      transition: all var(--transition-normal) ease;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px var(--shadow-color);
    }

    /* 仓库卡片增强 */
    .repo-card {
      display: block;
      text-decoration: none;
      color: inherit;
      position: relative;
      overflow: hidden;
    }

    .repo-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-color), var(--accent-light));
      transform: scaleX(0);
      transform-origin: left;
      transition: transform var(--transition-normal) ease;
    }

    .repo-card:hover::before {
      transform: scaleX(1);
    }

    .repo-card:hover {
      text-decoration: none;
    }

    .repo-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 1rem;
    }

    .repo-lang {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent-color);
    }

    .repo-lang-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* 按钮样式 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-md);
      font-weight: 500;
      transition: all var(--transition-fast) ease;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      color: white;
      box-shadow: 0 4px 15px var(--shadow-color);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow-color);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
    }

    .btn-outline:hover {
      background: var(--accent-color);
      color: white;
    }

    /* 深色模式切换 */
    .theme-toggle {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px var(--shadow-color);
      transition: all var(--transition-normal) ease;
      z-index: 100;
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
    }

    /* 粒子画布 */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* 主要内容区 */
    main {
      padding-top: 80px;
      position: relative;
      z-index: 10;
    }

    /* 欢迎区域 */
    .hero {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      animation: fadeInUp 1s ease;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      max-width: 600px;
      margin-bottom: 2rem;
      animation: fadeInUp 1s ease 0.2s both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 区域标题 */
    .section-title {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .section-subtitle {
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    /* 仓库卡片 */
    .repo-card {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .repo-card:hover {
      text-decoration: none;
    }

    /* 日志卡片 */
    .update-card {
      border-left: 4px solid var(--accent-color);
      position: relative;
    }

    .update-version-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      color: white;
    }

    /* 页脚 */
    .footer {
      background: var(--bg-secondary);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-color);
      padding: 3rem 2rem;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .footer-link {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: all var(--transition-fast) ease;
    }

    .footer-link:hover {
      background: var(--accent-color);
      color: white;
      transform: translateY(-3px);
    }

    /* 滚动显示动画 */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* 加载动画 */
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border-color);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 统计数字 */
    .stat-number {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* 滚动条样式 */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-dark);
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .hero-title {
        font-size: 2rem;
      }
      
      .hero-subtitle {
        font-size: 1rem;
      }
      
      .navbar {
        padding: 1rem;
      }
      
      .section-title {
        font-size: 1.5rem;
      }
      
      .stat-number {
        font-size: 2rem;
      }
      
      .theme-toggle {
        width: 45px;
        height: 45px;
        bottom: 1rem;
        right: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decoration">
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
  </div>

  <!-- 粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa fa-paw text-xl" style="color: var(--accent-color);"></i>
        <span class="font-bold text-lg" style="color: var(--accent-color);">桦知柚的主页</span>
      </div>
      <div class="flex items-center gap-6">
        <a href="#home" class="hover:text-blue-500 transition-colors">首页</a>
        <a href="#repos" class="hover:text-blue-500 transition-colors">仓库</a>
        <a href="#updates" class="hover:text-blue-500 transition-colors">日志</a>
      </div>
    </div>
  </nav>

  <!-- 主要内容 -->
  <main>
    <!-- 欢迎区域 -->
    <section id="home" class="hero">
      <h1 class="hero-title">欢迎来到桦知柚的主页</h1>
      <p class="hero-subtitle">
        这里是我的个人空间，记录技术成长，分享生活日常，探索更多有趣的可能 ✨
      </p>
      <div class="flex gap-4 flex-wrap justify-center">
        <a href="#repos" class="btn btn-primary">
          <i class="fa fa-github"></i> 查看我的仓库
        </a>
        <a href="#updates" class="btn btn-outline">
          浏览我的日志 <i class="fa fa-arrow-right"></i>
        </a>
      </div>
    </section>

    <!-- 仓库区域 -->
    <section id="repos" class="py-20 px-6">
      <div class="max-w-6xl mx-auto">
        <h2 class="section-title text-center reveal">我的项目仓库</h2>
        <p class="section-subtitle text-center reveal">
          我的开源项目与技术实践，点击卡片跳转 GitHub 仓库查看详情
        </p>
        <div id="repos-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- 仓库卡片由 JS 动态生成 -->
        </div>
      </div>
    </section>

    <!-- 更新日志区域 -->
    <section id="updates" class="py-20 px-6">
      <div class="max-w-3xl mx-auto">
        <h2 class="section-title text-center">更新日志</h2>
        <p class="section-subtitle text-center">
          记录技术思考、学习笔记与生活日常，持续更新中
        </p>
        <div id="updates-container" class="space-y-6">
          <!-- 更新日志由 JS 动态生成 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-links">
      <a href="https://github.com/HuaZHiyouyou" target="_blank" class="footer-link" title="GitHub">
        <i class="fa fa-github text-xl"></i>
      </a>
      <a href="#" class="footer-link" title="Twitter">
        <i class="fa fa-twitter text-xl"></i>
      </a>
      <a href="#" class="footer-link" title="邮箱">
        <i class="fa fa-envelope-o text-xl"></i>
      </a>
    </div>
    <p class="text-sm" style="color: var(--text-muted);">
      © 2024 桦知柚的个人主页 | Made with <i class="fa fa-heart" style="color: var(--accent-color);"></i> on GitHub Pages
    </p>
  </footer>

  <!-- 深色模式切换按钮 -->
  <button id="theme-toggle" class="theme-toggle" title="切换深色模式">
    <i id="theme-icon" class="fa fa-moon-o text-xl"></i>
  </button>

  <script>
    // 深色模式切换
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const root = document.documentElement;
    
    let isDark = localStorage.getItem('theme') === 'dark';
    
    function updateTheme() {
      if (isDark) {
        root.setAttribute('data-theme', 'dark');
        themeIcon.className = 'fa fa-sun-o text-xl';
      } else {
        root.removeAttribute('data-theme');
        themeIcon.className = 'fa fa-moon-o text-xl';
      }
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    
    updateTheme();
    
    themeToggle.addEventListener('click', () => {
      isDark = !isDark;
      updateTheme();
    });

    // GitHub 仓库获取
    const GITHUB_USERNAME = 'HuaZHiyouyou';
    const reposContainer = document.getElementById('repos-container');
    
    // 语言颜色映射
    function getLanguageColor(lang) {
      const colors = {
        'JavaScript': '#f1e05a',
        'TypeScript': '#3178c6',
        'Python': '#3572A5',
        'Java': '#b07219',
        'HTML': '#e34c26',
        'CSS': '#563d7c',
        'Vue': '#41b883',
        'Go': '#00ADD8',
        'Rust': '#dea584',
        'C++': '#f34b7d',
        'C': '#555555',
        'Shell': '#89e051'
      };
      return colors[lang] || '#60A5FA';
    }
    
    fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=6`)
      .then(res => res.json())
      .then(repos => {
        if (!Array.isArray(repos) || repos.length === 0) {
          reposContainer.innerHTML = `
            <div class="col-span-full p-6 rounded-2xl text-center card">
              <p style="color: var(--text-secondary);">暂无公开仓库</p>
            </div>
          `;
          return;
        }
        
        reposContainer.innerHTML = repos.map(repo => `
          <a href="${repo.html_url}" target="_blank" class="card repo-card reveal">
            <div class="repo-icon">
              <i class="fa fa-github text-xl"></i>
            </div>
            <h3 class="text-xl font-bold mb-2" style="color: var(--text-primary);">${repo.name}</h3>
            <p class="mb-4 line-clamp-2 min-h-[40px]" style="color: var(--text-secondary);">${repo.description || '暂无描述'}</p>
            ${repo.language ? `
              <div class="mb-3">
                <span class="repo-lang">
                  <span class="repo-lang-dot" style="background-color: ${getLanguageColor(repo.language)}"></span>
                  ${repo.language}
                </span>
              </div>
            ` : ''}
            <div class="flex items-center gap-4 text-sm">
              <span class="flex items-center gap-1" style="color: var(--text-muted);">
                <i class="fa fa-star"></i> ${repo.stargazers_count}
              </span>
              <span class="flex items-center gap-1" style="color: var(--text-muted);">
                <i class="fa fa-code-fork"></i> ${repo.forks_count}
              </span>
              <span class="ml-auto" style="color: var(--accent-color);">
                <i class="fa fa-arrow-right"></i>
              </span>
            </div>
          </a>
        `).join('');
      })
      .catch(err => {
        reposContainer.innerHTML = `<p class="col-span-full text-center" style="color: var(--text-secondary);">仓库获取失败</p>`;
      });

    // 更新日志数据
    const updatesData = [
      {
        version: 'v3.0',
        date: '2026-03-14',
        changes: [
          '简化页面功能，移除小工具和相册',
          '主题色改为蓝色',
          '新增粒子切换按钮',
          '设置改为深色模式切换',
          '保留粒子效果和音乐播放功能'
        ]
      },
      {
        version: 'v2.0',
        date: '2026-02-17',
        changes: [
          '添加了完整的缓存管理系统',
          '实现了日志记录和查看功能',
          '优化了粒子系统',
          '添加了左侧边栏和新闻模块'
        ]
      },
      {
        version: 'v1.0',
        date: '2026-02-16',
        changes: [
          '初始版本发布',
          '基础页面结构',
          '简单的粒子效果',
          '音乐播放器'
        ]
      }
    ];

    // 渲染更新日志
    const updatesContainer = document.getElementById('updates-container');
    updatesContainer.innerHTML = updatesData.map(update => `
      <div class="card update-card reveal">
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-3">
            <span class="update-version-badge">${update.version}</span>
            <h3 class="text-lg font-bold" style="color: var(--text-primary);">更新内容</h3>
          </div>
          <span class="text-sm" style="color: var(--text-muted);">
            <i class="fa fa-calendar mr-1"></i>${update.date}
          </span>
        </div>
        <ul class="space-y-2" style="color: var(--text-secondary);">
          ${update.changes.map(change => `
            <li class="flex items-start gap-2">
              <i class="fa fa-check-circle mt-1" style="color: var(--accent-color);"></i>
              <span>${change}</span>
            </li>
          `).join('')}
        </ul>
      </div>
    `).join('');

    // 导航栏滚动效果
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (window.scrollY > 50) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // 平滑滚动
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        
        const targetElement = document.querySelector(targetId);
        if (targetElement) {
          targetElement.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // 滚动显示动画
    const revealElements = document.querySelectorAll('.reveal');
    
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    });
    
    revealElements.forEach(el => revealObserver.observe(el));
  </script>
</body>
</html>
